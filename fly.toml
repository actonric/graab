# fly.toml app configuration file generated for graab on 2026-09-07T02:14:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'graab'
primary_region = 'sjc'

[build]
  dockerfile = 'deploy/Dockerfile'

[env]
  GRAAB_DEVICE_NAME = 'Graab MCP Bridge'
  GRAAB_LOG_MESSAGES = '0'
  GRAAB_MCP_HOST = '0.0.0.0'
  GRAAB_MCP_PORT = '8765'
  GRAAB_MCP_PUBLIC_URL = 'https://graab.fly.dev'
  GRAAB_MCP_TRANSPORT = 'http'
  GRAAB_READ_ONLY = '1'
  GRAAB_STORE_DIR = '/data'

[[mounts]]
  source = 'graab_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

[checks]
  [checks.mcp]
    port = 8765
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
