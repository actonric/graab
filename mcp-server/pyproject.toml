[project]
name = "graab-mcp"
version = "0.1.0"
description = "MCP server that lets Claude read and send WhatsApp messages via the Graab bridge."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.28",
    "uvicorn>=0.30",
]

[project.scripts]
graab-mcp = "graab_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graab_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
